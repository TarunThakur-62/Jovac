[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxsentinel"
version = "1.0.0"
description = "Linux Security Audit Tool"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1.0"
]

[tool.setuptools]
py-modules = ["cli", "main", "config"]

[tool.setuptools.packages.find]
include = ["auditors*", "core*", "utils*", "reports*"]

[project.scripts]
linuxsentinel = "cli:cli"
